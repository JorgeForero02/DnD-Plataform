name: CI
on:
  # Ramas de trabajo además de main: el repositorio no usa PR (un solo desarrollador, decisión
  # U-2 en docs/04-convenciones.md), así que sin esto una rama empujada no se probaría nunca
  # antes del merge. workflow_dispatch permite lanzarlo a mano sobre cualquier rama.
  push: { branches: [main, "fix/**", "chore/**", "docs/**"] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dnd
          POSTGRES_PASSWORD: dnd
          POSTGRES_DB: dnd
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dnd:dnd@localhost:5432/dnd
      JWT_SECRET: ci-secret-value-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from package.json "packageManager" — do NOT also pass
      # a `version` input here, or action-setup errors "Multiple versions specified".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # Threshold "high". Measured 2026-10-03 after the dependency patch: 0 high, 4 moderate, all
      # out of scope for a patch — 3 react-router advisories in apps/web (fixed only in v7, a major)
      # and 1 @opentelemetry/core via @sentry/node@8 (fixed only by Sentry 10, a major). fastify is
      # pinned to an EXACT version by @nestjs/platform-fastify (5.11.3 up to its last 11.x), so the
      # fixed fastify comes from the `pnpm.overrides` entry in the root package.json, not from a
      # range; drop that override when Nest moves to 12. Both majors have their ficha in
      # docs/06-pendientes.md.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm --filter @dnd/api prisma:generate
      - run: pnpm --filter @dnd/api exec prisma migrate deploy
      # The same command the pre-commit hook runs (build first, then lint — which carries the
      # architecture rule —, format, the three doc checks and the unit suites). Its definition
      # lives in package.json, not here: two copies of the step list drift apart.
      - run: pnpm verify
      - run: pnpm --filter @dnd/api test:e2e

  # Los e2e de navegador van aparte: necesitan los binarios de Playwright y dos
  # servidores vivos, y tardan bastante mas que la suite unitaria.
  e2e-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dnd
          POSTGRES_PASSWORD: dnd
          POSTGRES_DB: dnd
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dnd:dnd@localhost:5432/dnd
      JWT_SECRET: ci-secret-value-at-least-32-characters-long
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      # Every spec in this job registers/logs in from the CI runner's one IP — see the same
      # comment on the webServer entry in apps/web/playwright.config.ts (which sets this too;
      # kept here as well so the job's own environment reflects why it differs from `test`).
      # Never set on the `test` job above: apps/api/test/rate-limit.e2e-spec.ts must keep
      # asserting a 429 at the real AUTH_RATE_LIMIT_DEFAULT.
      AUTH_RATE_LIMIT: "1000"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dnd/api prisma:generate
      - run: pnpm --filter @dnd/api exec prisma migrate deploy
      - run: pnpm --filter @dnd/web exec playwright install --with-deps chromium
      - run: pnpm --filter @dnd/web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
