<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Reseño 2026-09-02 — la pestaña no tenía icono, así que el navegador ponía el suyo
         genérico. Es un SVG dibujado (la misma rosa de los vientos que el logotipo), no un
         emoji: escala a cualquier tamaño y lleva su propio fondo, porque una pestaña no hereda
         el tema de la página. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#10171c" />
    <title>Plataforma D&D</title>
    <!--
      Reseño 2026-09-02 — the four voices of the identity (Marcellus for titles, Public Sans
      for chrome, EB Garamond for the world's own text, IBM Plex Mono for figures). Google
      Fonts is the only font host this project can reach. display=swap plus the full local
      fallback stacks in tokens.css mean a slow or blocked font network changes how the page
      looks, never whether it works — the page always paints.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <!--
      Task 1.19, fix round 1, Important 7: main.tsx's initTheme() only runs once React has
      mounted — a user on a light OS who explicitly chose dark still gets a flash of the
      parchment palette on first paint, because tokens.css's own light-media-query fallback
      wins until JS catches up. This has to run before the stylesheet loads (Vite injects it
      after this point in <head>), synchronously, so [data-theme] is already correct by the
      time the CSS is parsed. Same storage key and try/catch as ui/theme.ts (getStoredTheme) —
      kept in sync by hand since this can't import that module.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dnd-theme");
          if (stored === "dark" || stored === "light") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          // Private browsing / storage disabled — tokens.css's prefers-color-scheme fallback
          // still applies with no [data-theme] attribute set.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
