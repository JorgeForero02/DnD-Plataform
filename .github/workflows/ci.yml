name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dnd
          POSTGRES_PASSWORD: dnd
          POSTGRES_DB: dnd
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dnd:dnd@localhost:5432/dnd
      JWT_SECRET: ci-secret-value-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" — do NOT also pass
      # a `version` input here, or action-setup errors "Multiple versions specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # Threshold is "high", not "moderate": `pnpm audit --prod` still finds 4 moderate
      # findings, both genuinely out of scope here — 3 react-router advisories in apps/web (a
      # different branch/task entirely) and 1 @opentelemetry/core via @sentry/node@^8, fixed
      # only by a Sentry v10 major bump (well beyond this task's declared Nest/Fastify upgrade,
      # and a risk of its own). Earlier this gate stopped at "critical" because of 2 high
      # fast-uri findings, believed to need a workspace-root pnpm.overrides outside this task's
      # boundary — that was wrong: fast-uri's patched versions (>=3.1.4, >=3.1.5) are already
      # inside the ^3.0.1 range ajv@8.20.0 itself declares. `pnpm update --filter @dnd/api
      # fast-uri --latest` (the command first tried) is a no-op on a non-direct dependency;
      # `pnpm update -r --depth Infinity fast-uri` is what actually re-resolves it (moved the
      # lockfile from 3.1.3 to 3.1.6). No override, no boundary violation, no more high findings.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm --filter @dnd/api prisma:generate
      - run: pnpm --filter @dnd/api exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:docs
      - run: pnpm check:estado
      - run: pnpm test
      - run: pnpm --filter @dnd/api test:e2e

  # Los e2e de navegador van aparte: necesitan los binarios de Playwright y dos
  # servidores vivos, y tardan bastante mas que la suite unitaria.
  e2e-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dnd
          POSTGRES_PASSWORD: dnd
          POSTGRES_DB: dnd
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dnd:dnd@localhost:5432/dnd
      JWT_SECRET: ci-secret-value-at-least-32-characters-long
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      # Every spec in this job registers/logs in from the CI runner's one IP — see the same
      # comment on the webServer entry in apps/web/playwright.config.ts (which sets this too;
      # kept here as well so the job's own environment reflects why it differs from `test`).
      # Never set on the `test` job above: apps/api/test/rate-limit.e2e-spec.ts must keep
      # asserting a 429 at the real AUTH_RATE_LIMIT_DEFAULT.
      AUTH_RATE_LIMIT: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dnd/api prisma:generate
      - run: pnpm --filter @dnd/api exec prisma migrate deploy
      - run: pnpm --filter @dnd/web exec playwright install --with-deps chromium
      - run: pnpm --filter @dnd/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
